<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- broad bean (fava): wide flat open pod, 4 large flat beans dominate, thin green rim, pale lining, short stub stem -->
  <!-- short thick stem stub (emerges from behind pod rim, no curl) -->
  <path d="M27.5 52.5 L20.5 46" fill="none" stroke="#558B2F" stroke-width="7.5" stroke-linecap="round"/>
  <!-- pod hull: wide flattish oval; pod wall is only a thin green rim -->
  <path d="M18.5 63.5
           C21 48 40 35.5 63 35.5
           C87 35.5 106 49 109.5 63.5
           C106 78.5 87 91.5 63 91.5
           C39 91.5 21 79.5 18.5 63.5 Z"
        fill="#7CB342" stroke="#558B2F" stroke-width="3" stroke-linejoin="round"/>
  <!-- pale cream-green lining of the opened pod, visible around the beans -->
  <path d="M24 63.5
           C26.5 51 41 41 63 41
           C85 41 100.5 51.5 104 63.5
           C100.5 76 85 86 63 86
           C41 86 26.5 76.5 24 63.5 Z"
        fill="#E8F0D8"/>
  <!-- 4 very large flat beans, packed edge to edge with slight overlap;
       each with a dark hilum dash along its lower edge -->
  <g transform="translate(39.5 62.5) rotate(-12)">
    <ellipse rx="10.6" ry="18" fill="#9CCC65" stroke="#558B2F" stroke-width="3"/>
    <path d="M-4.2 11.6 L4.2 10.6" fill="none" stroke="#33691E" stroke-width="4.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(55.7 63.5) rotate(8)">
    <ellipse rx="10.6" ry="18" fill="#8BC34A" stroke="#558B2F" stroke-width="3"/>
    <path d="M-4.2 11.6 L4.2 10.6" fill="none" stroke="#33691E" stroke-width="4.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(71.9 63.5) rotate(-8)">
    <ellipse rx="10.6" ry="18" fill="#9CCC65" stroke="#558B2F" stroke-width="3"/>
    <path d="M-4.2 11.6 L4.2 10.6" fill="none" stroke="#33691E" stroke-width="4.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(88.1 62.5) rotate(12)">
    <ellipse rx="10.6" ry="18" fill="#8BC34A" stroke="#558B2F" stroke-width="3"/>
    <path d="M-4.2 11.6 L4.2 10.6" fill="none" stroke="#33691E" stroke-width="4.6" stroke-linecap="round"/>
  </g>
</svg>
