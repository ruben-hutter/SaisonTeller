      <circle cx="71.5" cy="63" r="10.5"/>
      <circle cx="86.5" cy="63" r="10.5"/>
      <circle cx="49" cy="79" r="10.5"/>
      <circle cx="64" cy="79" r="10.5"/>
      <circle cx="79" cy="79" r="10.5"/>
      <circle cx="54.5" cy="95" r="10.5"/>
      <circle cx="73.5" cy="95" r="10.5"/>
    </g>
    <!-- drupelet body layer -->
    <g fill="#E23B57">
      <circle cx="34" cy="47" r="8.4"/>
