<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- wild garlic (ramsons): broad smooth leaves, white bulb, star-flower umbel -->
  <!-- leaves (drawn base-to-tip pointed ovals, widest below middle) -->
  <path d="M0 0 C-9.5 -4.5,-9.5 -23.5,0 -56 C9.5 -23.5,9.5 -4.5,0 0 Z" transform="translate(61 96) rotate(-34)" fill="#4E7A3A"/>
  <path d="M0 0 C-8 -3.4,-8 -17.6,0 -42 C8 -17.6,8 -3.4,0 0 Z" transform="translate(67 96) rotate(26)" fill="#4E7A3A"/>
  <path d="M0 0 C-10.5 -5.5,-10.5 -28.5,0 -68 C10.5 -28.5,10.5 -5.5,0 0 Z" transform="translate(64 96) rotate(-6)" fill="#5C8A3C"/>
  <!-- pale central veins -->
  <path d="M0 -9 C-1.2 -22,-0.6 -36,0 -46" transform="translate(61 96) rotate(-34)" fill="none" stroke="#F7F4EC" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M0 -8 C-1 -17,-0.5 -28,0 -35" transform="translate(67 96) rotate(26)" fill="none" stroke="#F7F4EC" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M0 -10 C-1.3 -27,-0.7 -44,0 -56" transform="translate(64 96) rotate(-6)" fill="none" stroke="#F7F4EC" stroke-width="1.4" stroke-linecap="round"/>
  <!-- angled stem to umbel -->
  <path d="M67 94 C86 84 96 62 96 41" fill="none" stroke="#4E7A3A" stroke-width="3" stroke-linecap="round"/>
  <!-- pedicels -->
  <path d="M96 40 C91 42.5 86 42.8 81.8 41.8 M96 40 C93.5 38.8 90.5 37.6 88.1 36.9 M96 40 L95 36.3 M96 40 C98.5 38.8 100.5 37.6 101.9 37 M96 40 C100.5 42.5 105 42.8 107.2 41.9" fill="none" stroke="#4E7A3A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- white bulb -->
  <ellipse cx="64" cy="97" rx="7" ry="10" fill="#EFEDE4" stroke="#C9C2A8" stroke-width="1"/>
  <!-- roots -->
  <path d="M59 104 C56 108 53 110.5 49.5 111.5 M64 106 C64 109 63.5 111 61.5 112.5 M69 104 C72 108 75 110.5 78.5 111.5" fill="none" stroke="#C9C2A8" stroke-width="1.7" stroke-linecap="round"/>
  <!-- star flowers (6 petals + pale center) -->
  <g stroke="#F7F4EC" stroke-width="1.8" stroke-linecap="round" fill="none">
    <g transform="translate(80.5 41.5)"><circle r="2.4" fill="#F7F4EC" stroke="none"/><path d="M0 -0.8L0 -3.2M0.74 -0.4L2.77 -1.6M0.74 0.4L2.77 1.6M0 0.8L0 3.2M-0.74 0.4L-2.77 1.6M-0.74 -0.4L-2.77 -1.6"/><circle r="1.1" fill="#D9CBA0" stroke="none"/></g>
    <g transform="translate(87.5 36.5)"><circle r="2.4" fill="#F7F4EC" stroke="none"/><path d="M0 -0.8L0 -3.2M0.74 -0.4L2.77 -1.6M0.74 0.4L2.77 1.6M0 0.8L0 3.2M-0.74 0.4L-2.77 1.6M-0.74 -0.4L-2.77 -1.6"/><circle r="1.1" fill="#D9CBA0" stroke="none"/></g>
    <g transform="translate(94.5 35)"><circle r="2.4" fill="#F7F4EC" stroke="none"/><path d="M0 -0.8L0 -3.2M0.74 -0.4L2.77 -1.6M0.74 0.4L2.77 1.6M0 0.8L0 3.2M-0.74 0.4L-2.77 1.6M-0.74 -0.4L-2.77 -1.6"/><circle r="1.1" fill="#D9CBA0" stroke="none"/></g>
    <g transform="translate(101.5 36.5)"><circle r="2.4" fill="#F7F4EC" stroke="none"/><path d="M0 -0.8L0 -3.2M0.74 -0.4L2.77 -1.6M0.74 0.4L2.77 1.6M0 0.8L0 3.2M-0.74 0.4L-2.77 1.6M-0.74 -0.4L-2.77 -1.6"/><circle r="1.1" fill="#D9CBA0" stroke="none"/></g>
    <g transform="translate(108.5 41.5)"><circle r="2.4" fill="#F7F4EC" stroke="none"/><path d="M0 -0.8L0 -3.2M0.74 -0.4L2.77 -1.6M0.74 0.4L2.77 1.6M0 0.8L0 3.2M-0.74 0.4L-2.77 1.6M-0.74 -0.4L-2.77 -1.6"/><circle r="1.1" fill="#D9CBA0" stroke="none"/></g>
  </g>
