<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- arugula signature: tiny 4-petaled cream flower with yellow center -->
  <defs>
    <g id="fl">
      <ellipse cx="0" cy="-3.5" rx="2.3" ry="3.4" fill="#F2E8D5"/>
      <ellipse cx="0" cy="-3.5" rx="2.3" ry="3.4" fill="#F2E8D5" transform="rotate(90)"/>
      <ellipse cx="0" cy="-3.5" rx="2.3" ry="3.4" fill="#F2E8D5" transform="rotate(180)"/>
      <ellipse cx="0" cy="-3.5" rx="2.3" ry="3.4" fill="#F2E8D5" transform="rotate(270)"/>
      <circle r="2.4" fill="#F5C542"/>
    </g>
  </defs>
  <!-- left lobed leaf, deep green, elongated, fanned left -->
  <g transform="translate(61 104) rotate(-32) scale(0.8 1.15)">
    <path d="M0 0 L0 7" fill="none" stroke="#A8C97F" stroke-width="4" stroke-linecap="round"/>
    <path d="M2.5 -3 Q12 -3 12 -9 Q12 -15 2.5 -15 L2.5 -20.5 Q14.5 -20.5 14.5 -26.5 Q14.5 -33 2.5 -33 L2.5 -38.5 Q15.5 -38.5 15.5 -45 Q15.5 -52 2.5 -52 L2.5 -57 Q16.5 -57 16.5 -64 Q16.5 -71 0 -71 Q-16.5 -71 -16.5 -64 Q-16.5 -57 -2.5 -57 L-2.5 -52 Q-15.5 -52 -15.5 -45 Q-15.5 -38.5 -2.5 -38.5 L-2.5 -33 Q-14.5 -33 -14.5 -26.5 Q-14.5 -20.5 -2.5 -20.5 L-2.5 -15 Q-12 -15 -12 -9 Q-12 -3 -2.5 -3 Q0 -1.8 2.5 -3 Z" fill="#33591F"/>
    <path d="M0 -3 L0 -56" fill="none" stroke="#A8C97F" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- right lobed leaf, mid green, elongated, fanned right -->
  <g transform="translate(67 104) rotate(32) scale(0.8 1.15)">
    <path d="M0 0 L0 7" fill="none" stroke="#A8C97F" stroke-width="4" stroke-linecap="round"/>
    <path d="M2.5 -3 Q12 -3 12 -9 Q12 -15 2.5 -15 L2.5 -20.5 Q14.5 -20.5 14.5 -26.5 Q14.5 -33 2.5 -33 L2.5 -38.5 Q15.5 -38.5 15.5 -45 Q15.5 -52 2.5 -52 L2.5 -57 Q16.5 -57 16.5 -64 Q16.5 -71 0 -71 Q-16.5 -71 -16.5 -64 Q-16.5 -57 -2.5 -57 L-2.5 -52 Q-15.5 -52 -15.5 -45 Q-15.5 -38.5 -2.5 -38.5 L-2.5 -33 Q-14.5 -33 -14.5 -26.5 Q-14.5 -20.5 -2.5 -20.5 L-2.5 -15 Q-12 -15 -12 -9 Q-12 -3 -2.5 -3 Q0 -1.8 2.5 -3 Z" fill="#4C7A2E"/>
    <path d="M0 -3 L0 -56" fill="none" stroke="#33591F" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- flower stalk rising from the base, with branch lines to the flower cluster -->
  <path d="M63 105 C62 90 61 70 62 47" fill="none" stroke="#A8C97F" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M62 47 L49 41 M62 47 L56 29 M62 47 L68 25 M62 47 L77 34" fill="none" stroke="#A8C97F" stroke-width="2" stroke-linecap="round"/>
  <use href="#fl" transform="translate(49 41) rotate(-18)"/>
  <use href="#fl" transform="translate(56 29) rotate(22)"/>
  <use href="#fl" transform="translate(68 25) rotate(-30)"/>
  <use href="#fl" transform="translate(77 34) rotate(14)"/>
</svg>
